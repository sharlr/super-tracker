# Super Tracker Nginx Configuration
# Add to /etc/nginx/sites-enabled/super-tracker.conf

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name app.supertracker.io admin.supertracker.io;
    return 301 https://$server_name$request_uri;
}

# HTTPS - API & WebSocket
server {
    listen 443 ssl http2;
    server_name app.supertracker.io;

    ssl_certificate /etc/letsencrypt/live/supertracker.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supertracker.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # API Proxy
    location /api/ {
        proxy_pass http://localhost:4010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket for live map
    location /socket.io/ {
        proxy_pass http://localhost:4010/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Health check
    location /health {
        proxy_pass http://localhost:4010/api/v1/health;
    }

    # Uploads
    location /uploads/ {
        alias /opt/super-tracker/st_uploads/;
        expires 30d;
    }
}

# HTTPS - Admin Console
server {
    listen 443 ssl http2;
    server_name admin.supertracker.io;

    ssl_certificate /etc/letsencrypt/live/supertracker.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supertracker.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/super-tracker/admin/dist;
    index index.html;

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1000;
}
